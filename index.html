<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="./resources/images/favicon-32x32.png">
  <link rel="stylesheet" href="./resources/style.css">

  <!-- FONTS -->
  <!-- MONTSERRAT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <!-- FRAUNCES -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap"
    rel="stylesheet">

  <title>Gabrielle Essence Eau De Parfum</title>
</head>

<body>
  <main class="container">
    <article class="card">
      <!-- image -->
      <div class="card_img">
        <picture>
          <source media="(min-width: 1024px)" srcset="resources/images/image-product-desktop.jpg" />
          <img src="./resources/images/image-product-mobile.jpg" alt="perfume bottle " />
        </picture>

      </div>
      <!-- text -->
      <section class="card_description">
        <p class="perfume">Perfume</p>
        <h1>Gabrielle Essence Eau De Parfum</h1>
        <p>
          A floral, solar and voluptuous
          interpretation composed by Oliver
          Polge, Perfumer-Creator for the House
          of CHANEL.
        </p>
        <div class="price">
          <span class="price_discount">$149.99</span>
          <span class="price_original">$169.99</span>
        </div>

        <button>
          <img src="resources/images/icon-cart.svg" />
          Add to Cart
        </button>
      </section>
    </article>
  </main>

</body>

</html>
